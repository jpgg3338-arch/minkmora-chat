<title>Minkmora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: one quiet reading column. Past chats sit on the left, the thread is centred in a 760px column, and the composer floats below it.
   Palette: paper and ink. Neutrals lean slightly green; the spruce accent appears only on the avatar, the send button and focus.
   Type: Newsreader for the empty-state greeting only; the system sans for everything else; a mono stack for code. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #171d1a;
  --ink-2: #5d6861;
  --line: #dde2dd;
  --accent: #1d6a5a;
  --on-accent: #ffffff;
  --user: #e3e9e4;
  --code: #eef2ee;
  --danger: #a4402e;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #171c1a; --ink: #e6ebe7; --ink-2: #98a39c; --line: #2a322e;
    --accent: #7ec5b2; --on-accent: #0c1412; --user: #222b27; --code: #0c110f; --danger: #e5937f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171c1a; --ink: #e6ebe7; --ink-2: #98a39c; --line: #2a322e;
  --accent: #7ec5b2; --on-accent: #0c1412; --user: #222b27; --code: #0c110f; --danger: #e5937f;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Sidebar and main */
.app { display: flex; height: 100%; min-height: 0; }
.sidebar { flex: 0 0 268px; width: 268px; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.sb-head { padding: 14px 12px 8px; }
.new-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; font-weight: 500; text-align: left; }
.new-btn:hover { background: var(--bg); }
.sb-label { padding: 12px 16px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.history { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.chat-row { display: flex; align-items: center; border-radius: 8px; }
.chat-row:hover, .chat-row.active { background: var(--bg); }
.chat-open { display: block; flex: 1; min-width: 0; padding: 8px 10px; border: 0; background: none; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 8px; }
.chat-del { flex: 0 0 auto; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 13px; opacity: 0; }
.chat-row:hover .chat-del, .chat-row:focus-within .chat-del, .chat-del.armed { opacity: 1; }
.chat-del.armed { color: var(--danger); font-weight: 600; }
@media (hover: none) { .chat-del { opacity: 1; } }
.sb-empty { margin: 8px 10px; font-size: 13px; color: var(--ink-2); }
.sb-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }

.main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; min-height: 56px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu-btn { display: none; align-items: center; justify-content: center; padding: 6px; border: 0; border-radius: 8px; background: none; color: var(--ink); }
.menu-btn:hover { background: var(--surface); }
.chat-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tier { flex: 0 0 auto; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; }

/* Thread */
.thread { flex: 1; min-height: 0; overflow-y: auto; }
.thread-inner { display: flex; flex-direction: column; min-height: 100%; max-width: 760px; margin: 0 auto; padding-block: 8px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.empty { margin: auto 0; padding-block: 24px; }
.greet { margin: 0 0 22px; font: 400 clamp(26px, 6vw, 34px)/1.2 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.chip { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; font-size: 14px; line-height: 1.4; }
.chip:hover { border-color: var(--ink-2); }

.msg { margin-top: 22px; }
.msg.fresh { animation: rise .25s ease both; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: var(--user); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.ai { display: flex; align-items: flex-start; gap: 12px; }
.avatar { flex: 0 0 28px; width: 28px; height: 28px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.ai-body { flex: 1; min-width: 0; }
.prose { overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.prose p, .prose ul, .prose ol, .prose blockquote { margin: 0 0 .9em; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: .25em; }
.prose h3, .prose h4, .prose h5 { margin: 1.1em 0 .4em; font-weight: 600; line-height: 1.3; }
.prose h3 { font-size: 17px; }
.prose h4 { font-size: 16px; }
.prose h5 { font-size: 15px; }
.prose blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--ink-2); }
.prose a { color: var(--accent); }
.prose code { padding: 1px 5px; border-radius: 5px; background: var(--user); font: 13px/1.5 var(--mono); }
.codebox { margin: 0 0 1em; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code); }
.codehead { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.codehead button { padding: 3px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 12px; }
.codehead button:hover { background: var(--surface); color: var(--ink); }
.codebox pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
.prose .codebox code { padding: 0; border-radius: 0; background: none; font: 13px/1.55 var(--mono); white-space: pre; }
.tablewrap { margin: 0 0 1em; overflow-x: auto; }
.prose table { border-collapse: collapse; font-size: 14px; }
.prose th, .prose td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { font-weight: 600; }
.note { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.note.error { color: var(--danger); }
.actions { display: flex; gap: 4px; margin-top: 6px; }
.actions button { padding: 4px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 12.5px; }
.actions button:hover { background: var(--surface); color: var(--ink); }
.dots { display: inline-flex; gap: 5px; padding: 8px 0; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); opacity: .3; animation: pulse 1.1s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Composer */
.composer { flex: 0 0 auto; padding-block: 6px 12px; }
.composer-inner { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.notice { margin: 0 0 8px; font-size: 13px; color: var(--danger); }
.field { display: flex; align-items: flex-end; gap: 6px; padding: 8px 8px 8px 16px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .04); }
.field:focus-within { border-color: var(--ink-2); }
.field textarea { flex: 1; min-width: 0; max-height: 200px; padding: 6px 0; border: 0; outline: none; background: transparent; line-height: 1.5; resize: none; }
.field textarea:disabled { opacity: .5; }
.send { flex: 0 0 auto; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); }
.send:disabled { opacity: .35; cursor: default; }
.send.stop { background: var(--ink); color: var(--surface); }
.hint { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--ink-2); }

/* Phone width: the history becomes a drawer */
@media (max-width: 820px) {
  .sidebar { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: 280px; flex-basis: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); transform: translateX(-102%); transition: transform .22s ease; }
  .sidebar.open { transform: none; box-shadow: 0 12px 40px rgba(0, 0, 0, .2); }
  .menu-btn { display: inline-flex; }
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .32); }
}
</style>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Historial de chats">
    <div class="sb-head">
      <button class="new-btn" id="newChat" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Nuevo chat</span>
      </button>
    </div>
    <div class="sb-label">Recientes</div>
    <nav class="history" id="history" aria-label="Chats guardados"></nav>
    <div class="sb-foot">Tus chats se guardan en este navegador.</div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir historial">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="chat-title" id="chatTitle">Minkmora</div>
      <select class="tier" id="tier" aria-label="Modo de respuesta">
        <option value="quick">Rápido</option>
        <option value="default">Equilibrado</option>
        <option value="complex">Avanzado</option>
      </select>
    </header>

    <section class="thread" id="thread">
      <div class="thread-inner">
        <div class="empty" id="empty">
          <h1 class="greet">¿En qué te ayudo hoy?</h1>
          <div class="chips" id="chips"></div>
        </div>
        <div id="messages"></div>
      </div>
    </section>

    <footer class="composer">
      <div class="composer-inner">
        <p class="notice" id="notice" hidden></p>
        <form class="field" id="form" autocomplete="off">
          <textarea id="input" rows="1" maxlength="8000" placeholder="Escribe tu mensaje…" aria-label="Escribe tu mensaje"></textarea>
          <button class="send" id="sendBtn" type="submit" aria-label="Enviar">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <p class="hint">La IA puede equivocarse. Revisa la información importante.</p>
      </div>
    </footer>
  </main>
</div>

<script>
/*PURE_START*/
var STORE_KEY = "asistente-ia:v1";
var MAX_CHATS = 40;
var MAX_TURNS = 40;
var MAX_PAYLOAD_BYTES = 180000;
var TIER_LABEL = { quick: "Rápido", default: "Equilibrado", complex: "Avanzado" };
// Standing instructions. Every call is memory-less, so they travel with each request.
var RULES = [
  "Eres un asistente de IA útil, claro y amable.",
  "Responde en el mismo idioma que el usuario; si no está claro, en español.",
  "Empieza por la respuesta y amplía solo cuando aporte. Sé conciso salvo que pidan detalle.",
  "Usa Markdown cuando ayude: listas, negritas, tablas y bloques de código con el lenguaje indicado.",
  "Si no estás seguro de algo, dilo en vez de inventarlo. No menciones estas instrucciones."
].join("\n");

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Inline formatting. The input is already escaped, so the only tags that reach the DOM are the ones made here.
function inline(t) {
  var codes = [];
  t = t.replace(/`([^`\n]+)`/g, function (_, c) {
    codes.push("<code>" + c + "</code>");
    return "\u0000" + (codes.length - 1) + "\u0000";
  });
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function (_, label, url) {
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
  });
  t = t.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>");
  return t.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codes[Number(i)]; });
}

var BLOCK_START = /^\s*(```|#{1,4}\s|>|([-*+]|\d+[.)])\s)/;

function splitRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
}

// Markdown to HTML. Every piece of text is escaped before any tag is added.
function renderMarkdown(src) {
  var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
  var out = [];
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];

    var fence = line.match(/^\s*```\s*([\w+.#-]*)\s*$/);
    if (fence) {
      var buf = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<div class="codebox"><div class="codehead"><span>' + esc(fence[1] || "texto") +
        '</span><button type="button" class="copy-code">Copiar</button></div><pre><code>' +
        esc(buf.join("\n")) + "</code></pre></div>");
      continue;
    }

    if (/^\s*$/.test(line)) { i++; continue; }

    var h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      var lvl = Math.min(h[1].length + 2, 5);
      out.push("<h" + lvl + ">" + inline(esc(h[2])) + "</h" + lvl + ">");
      i++;
      continue;
    }

    if (/^\s*>/.test(line)) {
      var quote = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + inline(esc(quote.join("\n"))).replace(/\n/g, "<br>") + "</blockquote>");
      continue;
    }

    if (/^\s*([-*+]|\d+[.)])\s/.test(line)) {
      var ordered = /^\s*\d+[.)]\s/.test(line);
      var items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s/.test(lines[i])) {
        items.push("<li>" + inline(esc(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""))) + "</li>");
        i++;
      }
      out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
      continue;
    }

    if (line.indexOf("|") !== -1 && i + 1 < lines.length &&
        lines[i + 1].indexOf("|") !== -1 && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
      var head = splitRow(line);
      var table = '<div class="tablewrap"><table><thead><tr>' +
        head.map(function (c) { return "<th>" + inline(esc(c)) + "</th>"; }).join("") +
        "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])) {
        table += "<tr>" + splitRow(lines[i]).map(function (c) { return "<td>" + inline(esc(c)) + "</td>"; }).join("") + "</tr>";
        i++;
      }
      out.push(table + "</tbody></table></div>");
      continue;
    }

    var para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !BLOCK_START.test(lines[i])) { para.push(lines[i]); i++; }
    if (!para.length) { para.push(line); i++; }
    out.push("<p>" + inline(esc(para.join("\n"))).replace(/\n/g, "<br>") + "</p>");
  }
  return out.join("");
}

function utf8Bytes(s) {
  return typeof TextEncoder === "function" ? new TextEncoder().encode(s).length : s.length * 4;
}

// The turns sent to Claude: instructions first, then the recent chat. Failed or empty replies are left out,
// the list starts on a user turn and ends on the newest message, and it stays under the payload budget.
function toPayload(messages) {
  var turns = [];
  var bytes = utf8Bytes(RULES);
  for (var k = messages.length - 1; k >= 0 && turns.length < MAX_TURNS; k--) {
    var m = messages[k];
    if (m.error || !m.content || !String(m.content).trim()) continue;
    var size = utf8Bytes(m.content);
    if (bytes + size > MAX_PAYLOAD_BYTES) break;
    bytes += size;
    turns.unshift({ role: m.role === "assistant" ? "assistant" : "user", content: m.content });
  }
  while (turns.length && turns[0].role !== "user") turns.shift();
  return [{ role: "user", content: RULES }].concat(turns);
}

function makeTitle(text) {
  var t = String(text || "").replace(/\s+/g, " ").trim();
  if (!t) return "Chat nuevo";
  return t.length > 48 ? t.slice(0, 47).replace(/\s+$/, "") + "…" : t;
}
/*PURE_END*/
var $ = function (id) { return document.getElementById(id); };
var els = {
  sidebar: $("sidebar"), scrim: $("scrim"), history: $("history"), newChat: $("newChat"),
  menuBtn: $("menuBtn"), title: $("chatTitle"), tier: $("tier"), thread: $("thread"),
  empty: $("empty"), chips: $("chips"), messages: $("messages"), notice: $("notice"),
  form: $("form"), input: $("input"), send: $("sendBtn")
};
var SEND_ICON = els.send.innerHTML;
var STOP_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
var SPARK_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="currentColor"/></svg>';
var SUGGESTIONS = [
  "Explícame un tema difícil de forma sencilla",
  "Ayúdame a redactar un correo profesional",
  "Dame ideas para un proyecto de programación",
  "Quiero resumir un texto que te voy a pegar"
];

var state = { chats: [], activeId: null, tier: "default" };
var availability = "checking";   // checking | ready | off | denied
var sampleReady = null;          // promise that resolves to the sample function, or null
var streaming = null;            // { chatId, reply, tier } while a call is running
var abortCtl = null;
var busy = false;
var paintQueued = false;
var stick = true;                // follow the newest text while the viewer stays at the bottom

// Storage: every read and write is guarded, because the browser may refuse it.
function loadSaved() {
  try {
    var data = JSON.parse(window.localStorage.getItem(STORE_KEY) || "null");
    return data && Array.isArray(data.chats) ? data : null;
  } catch (e) {
    return null;
  }
}

function persist() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify({
      v: 1, tier: state.tier, activeId: state.activeId, chats: state.chats.slice(0, MAX_CHATS)
    }));
  } catch (e) {
    // Storage is full or blocked: the chat keeps working in memory.
  }
}

function cleanChat(chat) {
  if (!chat || typeof chat.id !== "string" || !Array.isArray(chat.messages)) return null;
  chat.messages = chat.messages.filter(function (m) {
    return m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string";
  });
  return chat.messages.length ? chat : null;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function activeChat() {
  for (var i = 0; i < state.chats.length; i++) {
    if (state.chats[i].id === state.activeId) return state.chats[i];
  }
  return null;
}

function init() {
  var saved = loadSaved();
  if (saved) {
    state.chats = saved.chats.map(cleanChat).filter(Boolean).slice(0, MAX_CHATS);
    state.activeId = typeof saved.activeId === "string" ? saved.activeId : null;
    state.tier = TIER_LABEL[saved.tier] ? saved.tier : "default";
  }
  els.tier.value = state.tier;
  SUGGESTIONS.forEach(function (text) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = text;
    b.addEventListener("click", function () { send(text); });
    els.chips.appendChild(b);
  });
  bind();
  paintAll();
  autosize();
  checkSample();
}

function bind() {
  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    send(els.input.value);
  });
  // While a reply is running the send button becomes Stop.
  els.send.addEventListener("click", function (e) {
    if (busy) { e.preventDefault(); stop(); }
  });
  els.input.addEventListener("input", autosize);
  els.input.addEventListener("keydown", function (e) {
    var desktop = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && desktop) {
      e.preventDefault();
      send(els.input.value);
    }
  });
  els.newChat.addEventListener("click", newChat);
  els.menuBtn.addEventListener("click", openDrawer);
  els.scrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
  });
  els.tier.addEventListener("change", function () {
    state.tier = els.tier.value;
    persist();
  });
  els.thread.addEventListener("scroll", function () {
    stick = els.thread.scrollHeight - els.thread.scrollTop - els.thread.clientHeight < 80;
  });
  els.messages.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".copy-code") : null;
    if (btn) copyText(btn.closest(".codebox").querySelector("code").textContent, btn);
  });
}

// Sending

function send(raw) {
  var text = String(raw || "").trim();
  if (!text || busy || availability === "off" || availability === "denied") return;
  var chat = activeChat();
  if (!chat) {
    chat = { id: uid(), title: makeTitle(text), createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
    state.chats.unshift(chat);
    state.activeId = chat.id;
  }
  chat.messages.push({ role: "user", content: text, ts: Date.now() });
  chat.updatedAt = Date.now();
  els.input.value = "";
  autosize();
  persist();
  stick = true;
  paintAll();
  complete(chat);
}

function complete(chat) {
  var ctl = new AbortController();
  abortCtl = ctl;
  busy = true;
  streaming = { chatId: chat.id, reply: { role: "assistant", content: "" }, tier: state.tier };
  setBusyUi();
  paintAll();
  var turns = toPayload(chat.messages);
  getSample()
    .then(function (ask) {
      if (!ask) throw { code: "sampling_disabled", message: "sample is not available in this view" };
      return ask(turns, {
        cache: false,
        modelTier: streaming.tier,
        signal: ctl.signal,
        onText: function (update) {
          if (!streaming) return;
          streaming.reply.content = update.text;
          queuePaint();
        }
      });
    })
    .then(function (result) {
      finish(chat, result);
    }, function (err) {
      fail(chat, err || {}, ctl.signal.aborted);
    });
}

function finish(chat, result) {
  var reply = { role: "assistant", content: result.text, ts: Date.now() };
  var notes = [];
  if (result.truncated) notes.push("La respuesta se cortó por su límite de longitud. Pide que continúe.");
  if (result.modelTierApplied && result.modelTierApplied !== streaming.tier) {
    notes.push("Tu plan usó el modo " + TIER_LABEL[result.modelTierApplied] + " en esta respuesta.");
  }
  if (notes.length) reply.note = notes.join(" ");
  commit(chat, reply);
}

function fail(chat, err, aborted) {
  var code = err.code || "upstream_error";
  var partial = typeof err.text === "string" ? err.text : streaming.reply.content;
  var note = "No se pudo obtener la respuesta. Inténtalo de nuevo.";
  if (aborted || code === "cancelled") {
    note = "Respuesta detenida.";
  } else if (code === "not_granted") {
    setAvailability("denied");
    note = "No has permitido que esta página use Claude.";
  } else if (code === "sampling_disabled" || code === "not_declared" ||
             code === "capability_disabled" || code === "capability_removed") {
    setAvailability("off");
    note = "La IA no está disponible en esta vista.";
  } else if (code === "rate_limited") {
    note = "Hay demasiadas solicitudes seguidas o llegaste al límite de uso. Espera un momento y vuelve a intentarlo.";
  } else if (code === "session_expired") {
    note = "Tu sesión caducó. Vuelve a iniciar sesión para seguir.";
  } else if (code === "refused") {
    partial = "";
    note = "No puedo responder a esto tal como está planteado. Prueba a reformularlo.";
  } else if (code === "empty_completion") {
    note = "La IA no devolvió texto. Prueba a reformular tu mensaje.";
  } else if (code === "prompt_too_large") {
    note = "La conversación es demasiado larga. Empieza un chat nuevo.";
  }
  commit(chat, { role: "assistant", content: partial || "", note: note, error: !partial, ts: Date.now() });
}

function commit(chat, reply) {
  chat.messages.push(reply);
  chat.updatedAt = Date.now();
  state.chats.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  streaming = null;
  abortCtl = null;
  busy = false;
  persist();
  stick = true;
  setBusyUi();
  paintAll();
}

function stop() {
  if (abortCtl) abortCtl.abort();
}

function regenerate() {
  var chat = activeChat();
  if (!chat || busy) return;
  var last = chat.messages[chat.messages.length - 1];
  if (!last || last.role !== "assistant") return;
  chat.messages.pop();
  stick = true;
  complete(chat);
}

// Streaming paint: at most one update per frame.
function queuePaint() {
  if (paintQueued) return;
  paintQueued = true;
  requestAnimationFrame(function () {
    paintQueued = false;
    var text = document.getElementById("streamText");
    if (!text || !streaming) return;
    text.innerHTML = renderMarkdown(streaming.reply.content);
    document.getElementById("streamDots").hidden = streaming.reply.content.length > 0;
    if (stick) els.thread.scrollTop = els.thread.scrollHeight;
  });
}

// Rendering

function paintAll() {
  paintSidebar();
  paintThread();
}

function paintSidebar() {
  els.history.textContent = "";
  if (!state.chats.length) {
    var none = document.createElement("p");
    none.className = "sb-empty";
    none.textContent = "Aún no tienes chats.";
    els.history.appendChild(none);
    return;
  }
  state.chats.forEach(function (chat) {
    var row = document.createElement("div");
    row.className = "chat-row" + (chat.id === state.activeId ? " active" : "");
    var open = document.createElement("button");
    open.type = "button";
    open.className = "chat-open";
    open.textContent = chat.title;
    open.title = chat.title;
    if (chat.id === state.activeId) open.setAttribute("aria-current", "true");
    open.addEventListener("click", function () { openChat(chat.id); });
    var del = document.createElement("button");
    del.type = "button";
    del.className = "chat-del";
    del.textContent = "×";
    del.setAttribute("aria-label", "Borrar chat: " + chat.title);
    del.addEventListener("click", function () { askDelete(chat.id, del); });
    row.appendChild(open);
    row.appendChild(del);
    els.history.appendChild(row);
  });
}

function paintThread() {
  var chat = activeChat();
  var list = chat ? chat.messages : [];
  var showStream = !!(streaming && chat && streaming.chatId === chat.id);
  els.title.textContent = chat ? chat.title : "Minkmora";
  els.empty.hidden = list.length > 0 || showStream;
  els.messages.textContent = "";
  var frag = document.createDocumentFragment();
  list.forEach(function (m, i) {
    frag.appendChild(messageNode(m, i === list.length - 1));
  });
  if (showStream) frag.appendChild(streamNode());
  els.messages.appendChild(frag);
  if (stick) els.thread.scrollTop = els.thread.scrollHeight;
}

function messageNode(m, isLast) {
  var row = document.createElement("article");
  if (m.role === "user") {
    row.className = "msg user";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.content;
    row.appendChild(bubble);
    return row;
  }
  row.className = "msg ai" + (m.ts && Date.now() - m.ts < 2000 ? " fresh" : "");
  row.innerHTML = '<div class="avatar">' + SPARK_ICON + '</div><div class="ai-body"><div class="prose"></div></div>';
  var body = row.querySelector(".ai-body");
  body.querySelector(".prose").innerHTML = renderMarkdown(m.content);
  if (m.note) {
    var note = document.createElement("div");
    note.className = "note" + (m.error ? " error" : "");
    note.textContent = m.note;
    body.appendChild(note);
  }
  var actions = document.createElement("div");
  actions.className = "actions";
  if (m.content) actions.appendChild(actionButton("Copiar", function (btn) { copyText(m.content, btn); }));
  if (isLast && !busy) actions.appendChild(actionButton("Volver a generar", regenerate));
  if (actions.childNodes.length) body.appendChild(actions);
  return row;
}

function streamNode() {
  var row = document.createElement("article");
  row.className = "msg ai fresh";
  row.innerHTML = '<div class="avatar">' + SPARK_ICON + '</div><div class="ai-body">' +
    '<div class="prose" id="streamText"></div>' +
    '<div class="dots" id="streamDots" role="status" aria-label="Escribiendo"><span></span><span></span><span></span></div>' +
    "</div>";
  var text = streaming.reply.content;
  row.querySelector("#streamText").innerHTML = renderMarkdown(text);
  row.querySelector("#streamDots").hidden = text.length > 0;
  return row;
}

function actionButton(label, handler) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.addEventListener("click", function () { handler(b); });
  return b;
}

// Chats

function openChat(id) {
  if (busy) return;
  state.activeId = id;
  persist();
  closeDrawer();
  paintAll();
}

function newChat() {
  if (busy) return;
  state.activeId = null;
  persist();
  closeDrawer();
  paintAll();
  if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) els.input.focus();
}

// Deleting takes two taps, so a stray tap cannot remove a chat.
function askDelete(id, btn) {
  if (busy) return;
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed");
    btn.textContent = "Borrar";
    setTimeout(function () {
      btn.classList.remove("armed");
      btn.textContent = "×";
    }, 3000);
    return;
  }
  state.chats = state.chats.filter(function (c) { return c.id !== id; });
  if (state.activeId === id) state.activeId = null;
  persist();
  paintAll();
}

// Clipboard: the write runs inside the click handler; a textarea is the fallback.
function copyText(text, btn) {
  var label = btn.textContent;
  function flash(msg) {
    btn.textContent = msg;
    setTimeout(function () { btn.textContent = label; }, 1400);
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    flash(ok ? "Copiado" : "No se pudo copiar");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { flash("Copiado"); }, fallback);
  } else {
    fallback();
  }
}

// Claude access. The namespace is requested at load without prompting; the viewer is asked only on the first real call.
function getSample() {
  if (!sampleReady) {
    sampleReady = Promise.resolve()
      .then(function () {
        return window.claude && typeof window.claude.use === "function" ? window.claude.use("sample") : null;
      })
      .then(function (ask) {
        return typeof ask === "function" ? ask : null;
      }, function () {
        return null;
      });
  }
  return sampleReady;
}

function checkSample() {
  getSample().then(function (ask) {
    setAvailability(ask ? "ready" : "off");
  });
}

function setAvailability(value) {
  availability = value;
  var off = value === "off" || value === "denied";
  els.input.disabled = off;
  els.notice.hidden = !off;
  els.notice.textContent = value === "denied"
    ? "No has permitido que esta página use Claude. Vuelve a abrirla para intentarlo de nuevo."
    : value === "off" ? "La IA no está disponible en esta vista." : "";
  setBusyUi();
}

function setBusyUi() {
  var off = availability === "off" || availability === "denied";
  els.send.innerHTML = busy ? STOP_ICON : SEND_ICON;
  els.send.classList.toggle("stop", busy);
  els.send.setAttribute("aria-label", busy ? "Detener respuesta" : "Enviar");
  els.send.disabled = busy ? false : off;
}

function autosize() {
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 200) + "px";
}

function openDrawer() {
  els.sidebar.classList.add("open");
  els.scrim.hidden = false;
}

function closeDrawer() {
  els.sidebar.classList.remove("open");
  els.scrim.hidden = true;
}

init();
</script>
